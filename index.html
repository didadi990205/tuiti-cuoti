<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1677ff" />
    <meta name="description" content="行测图推错题工作台 - 自定义分类、手动裁剪、复盘管理" />
    <title>图推错题工作台</title>
    <script>
      // 配合 404.html 恢复 history 路由刷新后的原始路径（静态托管兜底方案）
      (function () {
        try {
          var redirect = sessionStorage.getItem('redirect-path');
          if (redirect) {
            sessionStorage.removeItem('redirect-path');
            // 仅在同一部署根路径下恢复，避免跨域跳转
            var currentBase = window.location.pathname.replace(/\/[^/]*$/, '');
            if (redirect.indexOf(currentBase) === 0) {
              var rest = redirect.slice(currentBase.length) || '/';
              window.history.replaceState(null, '', rest);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
